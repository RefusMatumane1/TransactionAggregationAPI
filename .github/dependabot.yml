version: 2

updates:
  - package-ecosystem: nuget
    directory: /TransactionAggregationAPI
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Base images are pinned by digest; this keeps those digests current.
  - package-ecosystem: docker
    directories:
      - /TransactionAggregationAPI/TransactionAggregationAPI
      - /TransactionAggregationAPI/TransactionAggregation.Worker
      - /TransactionAggregationAPI/TransactionAggregation.MockAggregator
      - /TransactionAggregationAPI/TransactionAggregationUI
    schedule:
      interval: weekly
