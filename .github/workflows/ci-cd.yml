name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository_owner }}/transactionaggregationapi
  IMAGE_UI: ${{ github.repository_owner }}/transactionaggregationui
  DOTNET_VERSION: '10.0.x'
  SOLUTION: TransactionAggregationAPI/TransactionAggregationAPI.slnx
  TEST_PROJECT: TransactionAggregationAPI/TransactionAggregation.Tests/TransactionAggregation.Tests.csproj

jobs:
  # ─── Build & Test ───────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore -c Release

      - name: Test
        run: |
          dotnet test ${{ env.TEST_PROJECT }} \
            --no-build \
            -c Release \
            --verbosity normal \
            --logger "trx;LogFileName=results.trx" \
            --results-directory ./artifacts/test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./artifacts/test-results/*.trx

  # ─── Docker Build (validation) ──────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: TransactionAggregationAPI
          file: TransactionAggregationAPI/TransactionAggregationAPI/Dockerfile
          push: false
          tags: ${{ env.IMAGE_API }}:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: TransactionAggregationAPI
          file: TransactionAggregationAPI/TransactionAggregationUI/Dockerfile
          push: false
          tags: ${{ env.IMAGE_UI }}:ci
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max

  # ─── Kubernetes Manifest Validation ─────────────────────────────────────────
  k8s-validate:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate namespace & shared config
        run: |
          kubeconform -strict -summary TransactionAggregationAPI/k8s/namespace.yaml
          kubeconform -strict -summary TransactionAggregationAPI/k8s/configmap.yaml
          kubeconform -strict -summary TransactionAggregationAPI/k8s/network-policy.yaml

      - name: Validate workload manifests
        run: |
          kubeconform -strict -summary TransactionAggregationAPI/k8s/postgres/
          kubeconform -strict -summary TransactionAggregationAPI/k8s/redis/
          kubeconform -strict -summary TransactionAggregationAPI/k8s/seq/
          kubeconform -strict -summary TransactionAggregationAPI/k8s/api/
          kubeconform -strict -summary TransactionAggregationAPI/k8s/ui/

      - name: Validate dev-tools
        run: |
          kubeconform -strict -summary TransactionAggregationAPI/k8s/dev-tools/pgadmin/
          kubeconform -strict -summary TransactionAggregationAPI/k8s/dev-tools/redis-commander/

  # ─── Publish Images to GHCR (main branch only) ──────────────────────────────
  publish:
    name: Publish Images
    runs-on: ubuntu-latest
    needs: [docker-build, k8s-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata — API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_API }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Extract metadata — UI
        id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_UI }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Push API image
        uses: docker/build-push-action@v6
        with:
          context: TransactionAggregationAPI
          file: TransactionAggregationAPI/TransactionAggregationAPI/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Push UI image
        uses: docker/build-push-action@v6
        with:
          context: TransactionAggregationAPI
          file: TransactionAggregationAPI/TransactionAggregationUI/Dockerfile
          push: true
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max

      - name: Summary
        run: |
          echo "### Images published" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| API | \`${{ steps.meta-api.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| UI  | \`${{ steps.meta-ui.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY

  # ─── Deploy (manual / environment-gated) ────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    # Requires a self-hosted runner or a kubeconfig secret pointing at your cluster.
    # Set KUBECONFIG_DATA secret in repo settings to enable this job.
    # Remove the condition below once the secret is configured.
    # env:
    #   KUBECONFIG: ${{ secrets.KUBECONFIG_DATA }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy notice
        run: |
          echo "### Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Add a \`KUBECONFIG_DATA\` secret and a self-hosted runner to enable automated k8s deployment." >> $GITHUB_STEP_SUMMARY
          echo "Images ready at:" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.IMAGE_API }}:sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ env.IMAGE_UI }}:sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
