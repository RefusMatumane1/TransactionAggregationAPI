name: ZAP Baseline Scan

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 1'

jobs:
  zap-baseline:
    name: ZAP Baseline against docker-compose stack
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        working-directory: TransactionAggregationAPI
        run: |
          docker compose up -d --build --wait --wait-timeout 600 || {
            echo "::error::Stack did not become healthy"
            docker compose logs api keycloak || true
            exit 1
          }

      - name: Smoke test
        working-directory: TransactionAggregationAPI
        run: scripts/smoke-test.sh http://localhost:5001

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:5001'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -I'
          fail_action: true

      - name: Stop the stack
        if: always()
        working-directory: TransactionAggregationAPI
        run: docker compose down -v
