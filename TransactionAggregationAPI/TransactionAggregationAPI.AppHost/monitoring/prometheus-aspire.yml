global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "aspire"

rule_files:
  - /etc/prometheus/rules.yml

# Prometheus does not expand environment variables in this file, so the targets are literal.
# The API and worker run on the host (launchSettings.json ports) and, in Development without
# Metrics__Port, serve /metrics on their normal HTTP port. AppHost.cs maps
# host.docker.internal to the host gateway so this also resolves on Linux engines.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: transaction-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5100"]

  - job_name: transaction-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5110"]
