global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "aspire"

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: transaction-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5100"]

  - job_name: transaction-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5110"]
