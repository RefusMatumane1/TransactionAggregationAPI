global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: transaction-api
    metrics_path: /metrics
    static_configs:
      - targets: ["${API_METRICS_TARGET}"]

  - job_name: transaction-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["${WORKER_METRICS_TARGET}"]
