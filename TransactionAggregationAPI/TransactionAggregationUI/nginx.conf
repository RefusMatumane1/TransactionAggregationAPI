# An envsubst template, rendered at container start by the nginx image's own entrypoint
# (20-envsubst-on-templates.sh), which substitutes only defined environment variables, so nginx
# $variables are left untouched:
#   ${API_UPSTREAM}           the API's URL (e.g. http://api:8080)
#   ${NGINX_LOCAL_RESOLVERS}  the container's DNS servers, from /etc/resolv.conf
#                             (exported by 15-local-resolvers.envsh; NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1)

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API's address is re-resolved (every 10 s) rather than fixed at startup: a recreated API
    # container gets a new IP, and a startup-resolved proxy_pass kept sending to the old one
    # (every call 502 until the UI was restarted). nginx's resolver ignores DNS search domains,
    # so API_UPSTREAM must be a name the DNS server answers as given (in Kubernetes, the FQDN).
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    # Proxy all /api/ calls to the backend API. A proxy_pass with no URI part forwards the
    # request's full /api/v1/... path unchanged.
    location /api/ {
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Blazor WASM SPA fallback — unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Correct MIME type for WebAssembly modules
    location ~* \.wasm$ {
        add_header Content-Type application/wasm;
        try_files $uri =404;
    }

    # The Blazor loader and dotnet.js have no fingerprint in their names, yet dotnet.js carries the
    # boot manifest naming every fingerprinted assembly. Cached as immutable they outlive a
    # rebuild, request assemblies that no longer exist and leave the app on "Loading…" forever.
    # Revalidate them (cheap 304s) on every load; the fingerprinted files stay cached.
    location ~* ^/_framework/(blazor\.webassembly|dotnet)\.js$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Cache immutable hashed assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache index.html so updates are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
