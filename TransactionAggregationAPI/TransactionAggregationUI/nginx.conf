# This file is processed as an envsubst template at container startup.
# ${API_UPSTREAM} is replaced with the actual API service URL (e.g. http://api:8080).
# Only ${API_UPSTREAM} is substituted — nginx $variables are left untouched.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/ calls to the backend API.
    # No trailing slash on proxy_pass — preserves the full /api/v1/... path when forwarding.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Blazor WASM SPA fallback — unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Correct MIME type for WebAssembly modules
    location ~* \.wasm$ {
        add_header Content-Type application/wasm;
        try_files $uri =404;
    }

    # Cache immutable hashed assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache index.html so updates are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
