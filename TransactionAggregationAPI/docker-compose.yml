services:
  api:
    build:
      context: .
      dockerfile: TransactionAggregationAPI/Dockerfile
    container_name: transactionaggregation-api-1
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__transactiondb=Host=postgres;Port=5432;Database=transactiondb;Username=postgres;Password=postgres
      - ConnectionStrings__redis=redis:6379
      - ConnectionStrings__seq=http://seq:80
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seq:
        condition: service_healthy
    networks:
      - transaction-network
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: TransactionAggregationUI/Dockerfile
    container_name: transactionaggregation-ui-1
    environment:
      # nginx proxies /api/ to this upstream — must be reachable from inside the container network
      - API_UPSTREAM=http://api:8080
    ports:
      - "7200:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - transaction-network
    restart: unless-stopped

  postgres:
    image: postgres:latest
    container_name: transactionaggregation-postgres-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transactiondb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transaction-network

  redis:
    image: redis:latest
    container_name: transactionaggregation-redis-1
    command: redis-server --appendonly yes --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - transaction-network

  seq:
    image: datalust/seq:latest
    platform: linux/amd64
    container_name: transactionaggregation-seq-1
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - transaction-network

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: transactionaggregation-pgadmin-1
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@transaction.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - transaction-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: transactionaggregation-redis-commander-1
    environment:
      REDIS_HOSTS: redis:6379
    ports:
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - transaction-network

volumes:
  postgres_data:
    name: transactionaggregation_postgres_data
  redis_data:
    name: transactionaggregation_redis_data
  seq_data:
    name: transactionaggregation_seq_data

networks:
  transaction-network:
    name: transactionaggregation-network
    driver: bridge