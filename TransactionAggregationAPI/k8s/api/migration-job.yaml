apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: transaction-aggregation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure

      securityContext:
        runAsUser: 1654
        runAsGroup: 1654
        runAsNonRoot: true

      containers:
        - name: migrate
          image: transactionaggregationapi:set-by-deploy-script
          imagePullPolicy: IfNotPresent

          command: ["dotnet", "TransactionAggregationAPI.dll", "--migrate-only"]

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          envFrom:
            - configMapRef:
                name: transaction-api-config

          env:
            - name: MIGRATOR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transaction-api-secrets
                  key: migrator-db-password
            - name: ConnectionStrings__transactiondb
              value: "Host=postgres;Port=5432;Database=transactiondb;Username=tagg_migrator;Password=$(MIGRATOR_DB_PASSWORD)"
            - name: ConnectionStrings__redis
              valueFrom:
                configMapKeyRef:
                  name: transaction-api-config
                  key: REDIS_CONNECTION_STRING
            - name: ConnectionStrings__seq
              valueFrom:
                configMapKeyRef:
                  name: transaction-api-config
                  key: SEQ_URL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: tmp
          emptyDir: {}
