# ── EF Core Migration Job ──────────────────────────────────────────────────
# Applies every module's migrations as the schema owner (tagg_migrator) with the image the API
# is about to run. Pods never migrate outside Development. deploy-k8s.sh runs it before the
# rollout and stops if it fails; by hand:
#   1. kubectl apply -f k8s/api/migration-job.yaml -n transaction-aggregation
#   2. kubectl wait --for=condition=complete job/db-migrate -n transaction-aggregation --timeout=300s
#   3. kubectl apply -f k8s/api/deployment.yaml -n transaction-aggregation
# ──────────────────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: transaction-aggregation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300 # Fail the job after 5 minutes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure

      securityContext:
        runAsUser: 1654
        runAsGroup: 1654
        runAsNonRoot: true

      containers:
        - name: migrate
          image: transactionaggregationapi:set-by-deploy-script # deploy-k8s.sh substitutes an immutable tag (git sha)
          imagePullPolicy: IfNotPresent

          # --migrate-only is handled in Program.cs: the app applies all pending
          # EF Core migrations and exits with code 0 without starting the web server.
          command: ["dotnet", "TransactionAggregationAPI.dll", "--migrate-only"]

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          # Startup (AuthenticationSetup.cs) validates Keycloak config and registers the Seq/Redis
          # clients during startup BEFORE the --migrate-only check runs (they're
          # builder-time calls, not app-time) — without these, the process
          # throws before ever reaching the migration. Verified: running this
          # container with only the env vars this Job used to declare crashes
          # with "Unable to add a Seq health check because the 'ServerUrl'
          # setting is missing" before a single migration is attempted.
          envFrom:
            - configMapRef:
                name: transaction-api-config

          env:
            # The only workload that connects as the schema owner: migrations need DDL, the
            # running application must not have it (k8s/postgres/init-roles.yaml).
            - name: MIGRATOR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transaction-api-secrets
                  key: migrator-db-password
            - name: ConnectionStrings__transactiondb
              value: "Host=postgres;Port=5432;Database=transactiondb;Username=tagg_migrator;Password=$(MIGRATOR_DB_PASSWORD)"
            - name: ConnectionStrings__redis
              valueFrom:
                configMapKeyRef:
                  name: transaction-api-config
                  key: REDIS_CONNECTION_STRING
            - name: ConnectionStrings__seq
              valueFrom:
                configMapKeyRef:
                  name: transaction-api-config
                  key: SEQ_URL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: tmp
          emptyDir: {}
