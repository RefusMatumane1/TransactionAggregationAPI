# ── DEV / STAGING ONLY ────────────────────────────────────────────────────
# Kafka UI can produce, delete and reset offsets on any topic — never expose it
# in production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/component: dev-tool
    app.kubernetes.io/part-of: transaction-aggregation
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-ui
        app.kubernetes.io/component: dev-tool
        app.kubernetes.io/part-of: transaction-aggregation
        environment: dev
    spec:
      # Same reason as the broker: injected KAFKA_* service-link variables would be
      # picked up as Kafka UI cluster config.
      enableServiceLinks: false
      containers:
        - name: kafka-ui
          image: kafbat/kafka-ui:v1.4.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "transaction-kafka"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka:9093"
            - name: DYNAMIC_CONFIG_ENABLED
              value: "true"
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
