apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/component: dev-tool
    app.kubernetes.io/part-of: transaction-aggregation
    environment: dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-ui
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: kafka-ui
    environment: dev
spec:
  ingressClassName: traefik
  rules:
    - host: kafka-ui.transaction.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafka-ui
                port:
                  name: http
