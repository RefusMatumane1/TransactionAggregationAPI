apiVersion: v1
kind: Service
metadata:
  name: redis-commander
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: redis-commander
    app.kubernetes.io/component: dev-tool
    app.kubernetes.io/part-of: transaction-aggregation
    environment: dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis-commander
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redis-commander
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: redis-commander
    environment: dev
spec:
  ingressClassName: traefik
  rules:
    - host: redis-commander.transaction.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redis-commander
                port:
                  name: http
