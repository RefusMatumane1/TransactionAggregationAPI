apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/part-of: transaction-aggregation
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: internal
      port: 9093
      targetPort: internal
      protocol: TCP
    - name: host
      port: 9092
      targetPort: host
      protocol: TCP
