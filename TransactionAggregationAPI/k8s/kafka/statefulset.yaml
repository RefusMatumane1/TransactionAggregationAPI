apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/part-of: transaction-aggregation
spec:
  # Single-node KRaft broker (combined broker + controller) — the same image and
  # listener layout Aspire's AddKafka and docker-compose use. For HA run a 3-node
  # quorum via the Strimzi operator or a managed Kafka service, and raise
  # Kafka__TopicReplicationFactor in the API ConfigMap to match.
  replicas: 1
  serviceName: kafka
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: message-broker
        app.kubernetes.io/part-of: transaction-aggregation
    spec:
      # Required: a Service named "kafka" makes Kubernetes inject KAFKA_PORT,
      # KAFKA_SERVICE_HOST, … into every pod, and Confluent images turn every KAFKA_*
      # variable into a broker property — KAFKA_PORT=tcp://… would break startup.
      enableServiceLinks: false

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000

      terminationGracePeriodSeconds: 60

      containers:
        - name: kafka
          image: confluentinc/confluent-local:8.1.1
          imagePullPolicy: IfNotPresent

          env:
            # PLAINTEXT / CONTROLLER stay on localhost (in-pod broker ↔ controller).
            # PLAINTEXT_INTERNAL (9093) is what in-cluster clients use: kafka:9093.
            # PLAINTEXT_HOST (9092) advertises localhost:9092 so a
            # `kubectl port-forward svc/kafka 9092:9092` works for clients on your machine.
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://localhost:29092,CONTROLLER://localhost:29093,PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://localhost:29092,PLAINTEXT_HOST://localhost:9092,PLAINTEXT_INTERNAL://kafka:9093"
            # The image logs to /tmp by default — keep topic data on the PVC.
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx1g"

          ports:
            - name: internal
              containerPort: 9093
              protocol: TCP
            - name: host
              containerPort: 9092
              protocol: TCP

          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"

          # Readiness asks the broker itself (JVM CLI, so generous timeout); liveness
          # only checks the listener so a slow CLI call can't get the broker killed.
          readinessProbe:
            exec:
              command: ["kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 20
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: internal
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data

  volumeClaimTemplates:
    - metadata:
        name: kafka-data
        labels:
          app.kubernetes.io/name: kafka
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 5Gi
