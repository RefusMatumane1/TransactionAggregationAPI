# The realm-export.json content below must stay in sync with keycloak/realm-export.json
# (used by docker-compose) — both define the same transaction-aggregation realm/clients so
# the app works the same way in either environment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: transaction-aggregation
data:
  realm-export.json: |
    {
      "realm": "transaction-aggregation",
      "enabled": true,
      "sslRequired": "none",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "accessTokenLifespan": 3600,
      "roles": {
        "realm": [
          {
            "name": "admin",
            "description": "Manages the banks (webhook sources) and the audit trail, on top of everything staff can see."
          },
          {
            "name": "staff",
            "description": "Read-only access to aggregated transactions: dashboards, breakdowns and the transaction list."
          }
        ]
      },
      "clients": [
        {
          "clientId": "transaction-ui",
          "name": "Transaction Aggregation UI",
          "description": "Public SPA client used by the Blazor WebAssembly UI for the Authorization Code + PKCE login flow. No client secret -- browsers cannot keep one.",
          "enabled": true,
          "publicClient": true,
          "protocol": "openid-connect",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": [
            "http://localhost:7200/authentication/login-callback",
            "http://localhost:7200/authentication/logout-callback",
            "http://ui.transaction.local/authentication/login-callback",
            "http://ui.transaction.local/authentication/logout-callback"
          ],
          "webOrigins": [
            "http://localhost:7200",
            "http://ui.transaction.local"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          },
          "protocolMappers": [
            {
              "name": "audience-transaction-ui",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "transaction-ui",
                "id.token.claim": "false",
                "access.token.claim": "true"
              }
            },
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "roles",
                "jsonType.label": "String",
                "multivalued": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "false"
              }
            },
            {
              "name": "institutions",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "consentRequired": false,
              "config": {
                "user.attribute": "institutions",
                "claim.name": "institutions",
                "jsonType.label": "String",
                "multivalued": "true",
                "aggregate.attrs": "false",
                "access.token.claim": "true",
                "id.token.claim": "false",
                "userinfo.token.claim": "false",
                "introspection.token.claim": "true"
              }
            }
          ]
        }
      ],
      "users": [
        {
          "username": "admin@test.com",
          "email": "admin@test.com",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Platform",
          "lastName": "Admin",
          "credentials": [
            {
              "type": "password",
              "value": "${TRANSACTION_APP_ADMIN_PASSWORD}",
              "temporary": false
            }
          ],
          "realmRoles": [
            "admin"
          ]
        }
      ],
      "components": {
        "org.keycloak.userprofile.UserProfileProvider": [
          {
            "providerId": "declarative-user-profile",
            "subComponents": {},
            "config": {
              "kc.user.profile.config": [
                "{\"attributes\": [{\"name\": \"username\", \"displayName\": \"${username}\", \"validations\": {\"length\": {\"min\": 3, \"max\": 255}, \"username-prohibited-characters\": {}, \"up-username-not-idn-homograph\": {}}, \"permissions\": {\"view\": [\"admin\", \"user\"], \"edit\": [\"admin\", \"user\"]}, \"multivalued\": false}, {\"name\": \"email\", \"displayName\": \"${email}\", \"validations\": {\"email\": {}, \"length\": {\"max\": 255}}, \"permissions\": {\"view\": [\"admin\", \"user\"], \"edit\": [\"admin\", \"user\"]}, \"multivalued\": false}, {\"name\": \"firstName\", \"displayName\": \"${firstName}\", \"validations\": {\"length\": {\"max\": 255}, \"person-name-prohibited-characters\": {}}, \"permissions\": {\"view\": [\"admin\", \"user\"], \"edit\": [\"admin\", \"user\"]}, \"multivalued\": false}, {\"name\": \"lastName\", \"displayName\": \"${lastName}\", \"validations\": {\"length\": {\"max\": 255}, \"person-name-prohibited-characters\": {}}, \"permissions\": {\"view\": [\"admin\", \"user\"], \"edit\": [\"admin\", \"user\"]}, \"multivalued\": false}, {\"name\": \"institutions\", \"displayName\": \"Institutions (bank codes this staff member may read)\", \"validations\": {\"length\": {\"max\": 50}}, \"permissions\": {\"view\": [\"admin\"], \"edit\": [\"admin\"]}, \"multivalued\": true}], \"groups\": [{\"name\": \"user-metadata\", \"displayHeader\": \"User metadata\", \"displayDescription\": \"Attributes, which refer to user metadata\"}]}"
              ]
            }
          }
        ]
      }
    }
