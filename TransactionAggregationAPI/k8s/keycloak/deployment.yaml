apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: transaction-aggregation
  annotations:
    configmap.reloader.stakater.com/reload: "keycloak-realm-config"
    secret.reloader.stakater.com/reload: "transaction-api-secrets"
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak

  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity
        app.kubernetes.io/part-of: transaction-aggregation

    spec:
      securityContext:
        fsGroup: 1000

      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--import-realm"]

          env:
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transaction-api-secrets
                  key: keycloak-admin-password

            - name: TRANSACTION_APP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transaction-api-secrets
                  key: app-admin-password

            - name: KC_HOSTNAME
              value: http://keycloak.transaction.local
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /realms/transaction-aggregation
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /realms/transaction-aggregation
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: keycloak-data
        - name: realm-import
          configMap:
            name: keycloak-realm-config
