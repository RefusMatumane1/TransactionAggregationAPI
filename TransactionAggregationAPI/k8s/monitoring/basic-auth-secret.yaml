# -----------------------------------------------------------------------
# Basic-auth credentials for the monitoring ingresses (Grafana, Prometheus).
# These are dev-cluster-only (Rancher Desktop / k3s, *.transaction.local
# hostnames), but both Prometheus and Grafana have no auth of their own —
# Grafana falls back to admin/admin (see docker-compose.yml) — so this is a
# cheap defense-in-depth layer at the ingress in front of them.
#
# IMPORTANT: Do NOT commit this file with real values to source control.
# Regenerate the htpasswd hash with:
#   openssl passwd -apr1 '<YOUR_PASSWORD>'
# and base64 the "admin:<hash>" line with:
#   echo -n 'admin:<hash>' | base64
# -----------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-basic-auth
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/component: security
type: Opaque
data:
  # base64("admin:$apr1$5wq6.1M.$Nn1J.AVbpYXoFIlxeR6u5/") — password is the
  # same CHANGE_ME_BEFORE_DEPLOY placeholder used elsewhere; replace before
  # applying to any cluster that isn't purely local/ephemeral.
  users: YWRtaW46JGFwcjEkNXdxNi4xTS4kTm4xSi5BVmJwWVhvRklseGVSNnU1Lw==
