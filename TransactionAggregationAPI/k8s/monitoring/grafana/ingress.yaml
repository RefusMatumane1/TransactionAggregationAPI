apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: transaction-aggregation
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: transaction-aggregation-monitoring-basic-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.transaction.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
