apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: transaction-aggregation
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        environment: "kubernetes"

    # Whole ConfigMap is mounted at /etc/prometheus (see deployment.yaml's
    # "config" volume), so a sibling key in this same data block lands at
    # /etc/prometheus/rules.yml with no extra volume/mount needed.
    rule_files:
      - /etc/prometheus/rules.yml

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # Auto-discover pods with prometheus.io/scrape: "true" annotation.
      # The API deployment already carries these annotations.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - transaction-aggregation
        relabel_configs:
          # Only scrape annotated pods
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # Honour custom metrics path annotation
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Replace pod address with annotated port
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: '$1:$2'
            target_label: __address__
          # Expose pod labels as metric labels
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          # Add namespace and pod name labels
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
          # Use app.kubernetes.io/name as the job label
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            target_label: job

  # Alert THRESHOLDS only — there is no Alertmanager deployed in k8s/monitoring/
  # (see production-readiness-checklist.md, Observability section), so a firing
  # alert here is visible in Prometheus's own UI/API (http://prometheus:9090/alerts)
  # but pages no one. Every expression below references a metric verified against
  # an actual source: the HTTP/runtime series match k8s/monitoring/grafana/
  # configmap-dashboards.yaml's own panel queries (prometheus-net's real metric
  # names, not assumed ones); the dead-letter counters are
  # TransactionAggregation.Infrastructure/Observability/DeadLetterMetrics.cs.
  # Thresholds mirror the dashboard's own existing color-threshold steps
  # (5% error rate, 1s P99) rather than inventing new numbers.
  rules.yml: |
    groups:
      - name: transaction-api.rules
        rules:
          - alert: TransactionApiDown
            expr: up{job="transaction-api"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "transaction-api target is down"
              description: "Prometheus has not successfully scraped {{ $labels.kubernetes_pod_name }} for 2 minutes. See docs/operations.md."

          - alert: TransactionApiHighErrorRate
            expr: |
              100 * sum(rate(http_request_duration_seconds_count{job="transaction-api",code=~"5.."}[5m]))
              / sum(rate(http_request_duration_seconds_count{job="transaction-api"}[5m]))
              > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "transaction-api 5xx rate above 5%"
              description: "Matches the dashboard's own red threshold (Error Rate panel). Check readiness (/health) first — Postgres/Redis outages surface here before their own signal exists (no DB/Redis exporter is deployed)."

          - alert: TransactionApiHighLatencyP99
            expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="transaction-api"}[5m])) by (le)) > 1
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "transaction-api P99 latency above 1s"
              description: "Matches the dashboard's own red threshold (P99 Latency panel)."

          - alert: TransactionApiHighMemoryUsage
            expr: process_working_set_bytes{job="transaction-api"} > 450 * 1024 * 1024
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "transaction-api working set approaching its 512Mi container limit"
              description: "k8s/api/deployment.yaml sets a 512Mi memory limit; sustained usage above ~450Mi risks an OOMKill. See docs/operations.md."

      - name: message-dispatch.rules
        rules:
          - alert: OutboxMessagesDeadLettering
            expr: increase(outbox_messages_dead_lettered_total{job="transaction-api"}[15m]) > 0
            labels:
              severity: warning
            annotations:
              summary: "Outbox message(s) dead-lettered in the last 15 minutes"
              description: "See docs/operations.md §4 (Poison messages / dead-letter pileup) for the investigation steps."

          - alert: InboxMessagesDeadLettering
            expr: increase(inbox_messages_dead_lettered_total{job="transaction-api"}[15m]) > 0
            labels:
              severity: warning
            annotations:
              summary: "Inbox message(s) dead-lettered in the last 15 minutes"
              description: "See docs/operations.md §4 (Poison messages / dead-letter pileup) for the investigation steps."
