apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: transaction-aggregation
spec:
  # ClusterIP — PostgreSQL is an internal service; never expose externally.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
