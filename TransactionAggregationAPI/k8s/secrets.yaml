# -----------------------------------------------------------------------
# IMPORTANT: Do NOT commit this file with real values to source control.
# Generate real secrets with:
#   kubectl create secret generic transaction-api-secrets \
#     --from-literal=postgres-password='<YOUR_PASSWORD>' \
#     --from-literal=keycloak-admin-password='<ADMIN_PASSWORD>' \
#     --from-literal=keycloak-admin-client-secret='<MUST_MATCH_transaction-admin_CLIENT_SECRET_IN_k8s/keycloak/configmap.yaml>' \
#     --from-literal=pgadmin-password='<ADMIN_PASSWORD>' \
#     --from-literal=bank-aggregator-client-id='<FROM_AGGREGATOR_DASHBOARD>' \
#     --from-literal=bank-aggregator-client-secret='<FROM_AGGREGATOR_DASHBOARD>' \
#     -n transaction-aggregation --dry-run=client -o yaml > secrets.yaml
#
# All values below are base64(placeholder) — replace before applying.
# -----------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: transaction-api-secrets
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: transaction-aggregation
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # base64("CHANGE_ME_BEFORE_DEPLOY") — an obviously-fake placeholder rather
  # than a realistic-looking password like the old "postgres" value, so it's
  # unmistakable that it must be replaced before this manifest is applied.
  postgres-password: Q0hBTkdFX01FX0JFRk9SRV9ERVBMT1k=

  # base64("CHANGE_ME_BEFORE_DEPLOY")
  keycloak-admin-password: Q0hBTkdFX01FX0JFRk9SRV9ERVBMT1k=

  # base64("dev-only-admin-client-secret") — matches the "transaction-admin" client's secret
  # baked into k8s/keycloak/configmap.yaml's realm-export. These two must be rotated together:
  # changing one without the other breaks IKeycloakAdminClient's client-credentials grant
  # (used to provision customers — see CreateCustomerCommandHandler/SeedData). Fine for a local/
  # ephemeral cluster; rotate both for anything else.
  keycloak-admin-client-secret: ZGV2LW9ubHktYWRtaW4tY2xpZW50LXNlY3JldA==

  # base64("CHANGE_ME_BEFORE_DEPLOY")
  pgadmin-password: Q0hBTkdFX01FX0JFRk9SRV9ERVBMT1k=

  # Bank aggregator app credentials. base64("CHANGE_ME_BEFORE_DEPLOY")
  bank-aggregator-client-id: Q0hBTkdFX01FX0JFRk9SRV9ERVBMT1k=
  bank-aggregator-client-secret: Q0hBTkdFX01FX0JFRk9SRV9ERVBMT1k=

  # Webhook auth keys are NOT here — they live in the WebhookSources table, managed live via
  # /api/v1/admin/webhook-sources (the admin UI), and only a SHA-256 hash is ever stored. See
  # WebhookSourceEndpoints/ApiKeyEndpointFilter/WebhookSource.
