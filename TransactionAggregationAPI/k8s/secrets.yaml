# -----------------------------------------------------------------------
# IMPORTANT: Do NOT commit this file with real values to source control.
# Generate real secrets with:
#   kubectl create secret generic transaction-api-secrets \
#     --from-literal=postgres-password='<YOUR_PASSWORD>' \
#     --from-literal=keycloak-admin-password='<ADMIN_PASSWORD>' \
#     --from-literal=app-admin-password='<ADMIN_PASSWORD>' \
#     --from-literal=migrator-db-password='<RANDOM_32+_CHARS>' \
#     --from-literal=app-db-password='<RANDOM_32+_CHARS>' \
#     --from-literal=pgadmin-password='<ADMIN_PASSWORD>' \
#     -n transaction-aggregation --dry-run=client -o yaml > secrets.yaml
#
# All values below are base64(placeholder) — replace before applying.
# -----------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: transaction-api-secrets
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: transaction-aggregation
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # base64("CHANGE_ME_BEFORE_DEPLOY") — an obviously-fake placeholder rather
  # than a realistic-looking password like the old "postgres" value, so it's
  # unmistakable that it must be replaced before this manifest is applied.
  postgres-password: Q0hBTkdFX01FX0JFRk9SRV9ERVBMT1k=

  # base64("CHANGE_ME_BEFORE_DEPLOY")
  keycloak-admin-password: Q0hBTkdFX01FX0JFRk9SRV9ERVBMT1k=

  # base64("CHANGE_ME_BEFORE_DEPLOY") — password of the application's admin@test.com user
  # (realm role "admin"), read into the realm import as ${TRANSACTION_APP_ADMIN_PASSWORD}.
  app-admin-password: Q0hBTkdFX01FX0JFRk9SRV9ERVBMT1k=

  # base64("CHANGE_ME_BEFORE_DEPLOY") — least-privilege database roles (k8s/postgres/init-roles.yaml):
  # the schema owner, used only by the db-migrate Job, and the DML-only role the API and worker use.
  migrator-db-password: Q0hBTkdFX01FX0JFRk9SRV9ERVBMT1k=
  app-db-password: Q0hBTkdFX01FX0JFRk9SRV9ERVBMT1k=

  # base64("CHANGE_ME_BEFORE_DEPLOY")
  pgadmin-password: Q0hBTkdFX01FX0JFRk9SRV9ERVBMT1k=

  # Webhook API keys are not here: each bank's key is issued through /api/v1/admin/webhook-sources
  # and only its SHA-256 hash is stored (WebhookSource, WebhookApiKeyEndpointFilter).
  #
  # In production these values come from Vault instead (k8s/vault/), rendered as the hosts'
  # secrets.json; this Secret serves local clusters without a Vault.
