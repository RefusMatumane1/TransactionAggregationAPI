apiVersion: v1
kind: Service
metadata:
  name: seq
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: seq
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: transaction-aggregation
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: seq
  ports:
    # The API connects to this port for log ingestion (http://seq:80)
    - name: ui
      port: 80
      targetPort: 80
      protocol: TCP
    # Legacy / Serilog.Sinks.Seq default ingestion port
    - name: ingestion
      port: 5341
      targetPort: 5341
      protocol: TCP
