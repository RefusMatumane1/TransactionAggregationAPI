apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-ui
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: transaction-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: transaction-aggregation
    app.kubernetes.io/version: "1.0.0"
  annotations:
    configmap.reloader.stakater.com/reload: "transaction-ui-config"
spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-ui

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: transaction-ui
        app.kubernetes.io/component: ui
        app.kubernetes.io/part-of: transaction-aggregation
        app.kubernetes.io/version: "1.0.0"

    spec:
      # nginx-unprivileged: every process runs as uid 101 and listens on 8080.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 30

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: transaction-ui

      containers:
        - name: transaction-ui

          image: transactionaggregationui:set-by-deploy-script # deploy-k8s.sh substitutes an immutable tag (git sha)
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: transaction-ui-config

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
