# Strategic-merge patch for deployment/transaction-api: the Vault Agent Injector renders the API's
# secrets.json from Vault into /vault/secrets/, and Secrets__FilePath points the host at it. The
# rendered file has the same shape as the local secrets.json, so the application does not know
# Vault exists. Applied by `deploy-k8s.sh --vault` (k8s/vault/README.md).
spec:
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "transaction-api"
        vault.hashicorp.com/agent-pre-populate: "true"
        vault.hashicorp.com/agent-inject-secret-secrets.json: "secret/data/transaction-aggregation/api"
        vault.hashicorp.com/agent-inject-template-secrets.json: |
          {{- with secret "secret/data/transaction-aggregation/api" -}}
          {{ .Data.data | toJSON }}
          {{- end }}
    spec:
      containers:
        - name: transaction-api
          env:
            - name: Secrets__FilePath
              value: /vault/secrets/secrets.json
            # Environment variables outrank secrets.json, so the Secret-based connection string
            # is removed: the one in Vault is the only one the host sees.
            - name: ConnectionStrings__transactiondb
              $patch: delete
            - name: APP_DB_PASSWORD
              $patch: delete
