apiVersion: v1
kind: ConfigMap
metadata:
  name: transaction-worker-config
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: transaction-aggregation
    app.kubernetes.io/component: worker-config
data:

  KAFKA_BOOTSTRAP_SERVERS: "kafka:9093"
  Kafka__IntegrationEventsTopic: "transaction-events"
  Kafka__Enabled: "true"
  Kafka__BankTransactionsTopic: "bank-transactions"
  Kafka__DeadLetterTopic: "bank-transactions.dlq"
  Kafka__GroupId: "transaction-aggregation-api"
  Kafka__CreateTopics: "true"
  Kafka__TopicPartitions: "6"
  Kafka__TopicReplicationFactor: "1"
  Kafka__MaxRetryBackoffSeconds: "60"

  NotificationOptions__DuplicateAlertWebhookUrl: ""

  Outbox__PollIntervalSeconds: "5"
  Outbox__BatchSize: "200"
  Outbox__MaxConcurrency: "16"
  Outbox__MaxAttempts: "5"

  # ── Inbound webhook inbox dispatcher ────────────────────────────────────
  # Polls InboxMessages for raw webhook payloads queued by ReceiveBankTransactionsCommandHandler
  # — see InboxDispatcherBackgroundService. Same multi-replica-safe claim as the outbox.
  Inbox__PollIntervalSeconds: "5"
  Inbox__BatchSize: "50"
  Inbox__MaxAttempts: "5"

  # ── Message archive ─────────────────────────────────────────────────────
  # Processed inbox/outbox rows older than RetainDays move to messaging.*Archive tables.
  # Nothing is deleted; duplicate-delivery detection also checks the archive.
  MessageArchive__RetainDays: "30"
  MessageArchive__BatchSize: "1000"
  MessageArchive__MaxBatchesPerRun: "50"

  Aggregation__IntervalMinutes: "5"
  Aggregation__OverlapMinutes: "10"
  Aggregation__MaxRowsPerRun: "500000"
