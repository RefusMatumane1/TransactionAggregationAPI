apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-worker
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: transaction-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: transaction-aggregation
    app.kubernetes.io/version: "1.0.0"
  annotations:
    configmap.reloader.stakater.com/reload: "transaction-api-config"
    secret.reloader.stakater.com/reload: "transaction-api-secrets"
spec:

  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-worker

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: transaction-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: transaction-aggregation
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"

    spec:
      securityContext:
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        runAsNonRoot: true

      terminationGracePeriodSeconds: 60

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: transaction-worker

      containers:
        - name: transaction-worker
          image: transactionaggregationworker:set-by-deploy-script
          imagePullPolicy: IfNotPresent

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9464
              protocol: TCP

          envFrom:
            - configMapRef:
                name: transaction-api-config
            - configMapRef:
                name: transaction-worker-config

          env:
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transaction-api-secrets
                  key: app-db-password

            - name: ConnectionStrings__transactiondb
              value: "Host=pgbouncer;Port=6432;Database=transactiondb;Username=tagg_app;Password=$(APP_DB_PASSWORD);Maximum Pool Size=20;No Reset On Close=true"

            - name: ConnectionStrings__redis
              valueFrom:
                configMapKeyRef:
                  name: transaction-api-config
                  key: REDIS_CONNECTION_STRING

            - name: ConnectionStrings__seq
              valueFrom:
                configMapKeyRef:
                  name: transaction-api-config
                  key: SEQ_URL

            - name: ConnectionStrings__kafka
              valueFrom:
                configMapKeyRef:
                  name: transaction-worker-config
                  key: KAFKA_BOOTSTRAP_SERVERS

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18

      volumes:
        - name: tmp
          emptyDir: {}
