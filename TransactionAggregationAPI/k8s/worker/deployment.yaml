# ── Background worker ──────────────────────────────────────────────────────
# Kafka consumer + inbox/outbox/pending-expiry dispatchers (TransactionAggregation.Worker).
# Scales independently of the API: every dispatcher claims rows with
# FOR UPDATE SKIP LOCKED, so replicas drain the queues in parallel. Kafka
# parallelism is capped by Kafka__TopicPartitions — replicas beyond that sit idle
# on the consumer side but still help drain the inbox/outbox.
#
# No Service: nothing calls the worker. Prometheus scrapes the pods directly via
# the annotations below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-worker
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: transaction-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: transaction-aggregation
    app.kubernetes.io/version: "1.0.0"
  annotations:
    configmap.reloader.stakater.com/reload: "transaction-api-config"
    secret.reloader.stakater.com/reload: "transaction-api-secrets"
spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-worker

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: transaction-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: transaction-aggregation
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"

    spec:
      securityContext:
        runAsUser: 1654 # Matches APP_UID in the Dockerfile
        runAsGroup: 1654
        fsGroup: 1654
        runAsNonRoot: true

      # Long enough for an in-flight inbox/outbox batch to finish and for the Kafka
      # consumer to commit its offsets and leave the group cleanly.
      terminationGracePeriodSeconds: 60

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: transaction-worker

      # Migrations are applied by the db-migrate Job (k8s/api/migration-job.yaml)
      # before rollout; the worker never migrates.

      containers:
        - name: transaction-worker
          # Build with: docker build -t <registry>/transactionaggregationworker:1.0.0 -f TransactionAggregation.Worker/Dockerfile .
          image: transactionaggregationworker:set-by-deploy-script # deploy-k8s.sh substitutes an immutable tag (git sha)
          imagePullPolicy: IfNotPresent

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Shares the API's ConfigMap: Outbox__*, Inbox__*, PendingExpiry__*, Kafka__*,
          # NotificationOptions__* and Serilog__* are read here; the HTTP-only keys are ignored.
          envFrom:
            - configMapRef:
                name: transaction-api-config

          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transaction-api-secrets
                  key: postgres-password

            - name: ConnectionStrings__transactiondb
              value: "Host=postgres;Port=5432;Database=transactiondb;Username=postgres;Password=$(POSTGRES_PASSWORD)"

            - name: ConnectionStrings__redis
              valueFrom:
                configMapKeyRef:
                  name: transaction-api-config
                  key: REDIS_CONNECTION_STRING

            - name: ConnectionStrings__seq
              valueFrom:
                configMapKeyRef:
                  name: transaction-api-config
                  key: SEQ_URL

            # Kafka bootstrap servers (ConnectionStrings:kafka). The consumer only
            # starts when this is set.
            - name: ConnectionStrings__kafka
              valueFrom:
                configMapKeyRef:
                  name: transaction-api-config
                  key: KAFKA_BOOTSTRAP_SERVERS

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

          # /alive only checks the "self" tag — the process is up and responsive.
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          # No readinessProbe: the worker receives no traffic, so readiness would only
          # gate rollouts. /health still reports Redis for dashboards and manual checks.
          startupProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18

      volumes:
        - name: tmp
          emptyDir: {}
