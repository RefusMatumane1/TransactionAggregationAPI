# ── Background worker ──────────────────────────────────────────────────────
# Kafka consumer + inbox/outbox dispatchers + message archiving (TransactionAggregation.Worker).
# Scales independently of the API: every dispatcher claims rows with
# FOR UPDATE SKIP LOCKED, so replicas drain the queues in parallel. Kafka
# parallelism is capped by Kafka__TopicPartitions — replicas beyond that sit idle
# on the consumer side but still help drain the inbox/outbox.
#
# Replica count is owned by the autoscaler: worker/scaledobject.yaml (KEDA, scales on the
# inbox/outbox backlog) or worker/hpa.yaml (CPU fallback when KEDA is not installed).
#
# No Service: nothing calls the worker. Prometheus scrapes the pods directly via
# the annotations below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-worker
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: transaction-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: transaction-aggregation
    app.kubernetes.io/version: "1.0.0"
  annotations:
    configmap.reloader.stakater.com/reload: "transaction-api-config"
    secret.reloader.stakater.com/reload: "transaction-api-secrets"
spec:

  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-worker

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: transaction-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: transaction-aggregation
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"

    spec:
      securityContext:
        runAsUser: 1654 # Matches APP_UID in the Dockerfile
        runAsGroup: 1654
        fsGroup: 1654
        runAsNonRoot: true

      # Long enough for an in-flight inbox/outbox batch to finish and for the Kafka
      # consumer to commit its offsets and leave the group cleanly.
      terminationGracePeriodSeconds: 60

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: transaction-worker

      # Migrations are applied by the db-migrate Job (k8s/api/migration-job.yaml)
      # before rollout; the worker never migrates.

      containers:
        - name: transaction-worker
          # Build with: docker build -t <registry>/transactionaggregationworker:1.0.0 -f TransactionAggregation.Worker/Dockerfile .
          image: transactionaggregationworker:set-by-deploy-script # deploy-k8s.sh substitutes an immutable tag (git sha)
          imagePullPolicy: IfNotPresent

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # /metrics (Metrics__Port in the ConfigMap); scraped from the pod IP, never exposed.
            - name: metrics
              containerPort: 9464
              protocol: TCP

          # The shared settings, then the worker's own (Kafka__*, Outbox__*, Inbox__*,
          # MessageArchive__*, NotificationOptions__*). The HTTP-only keys in the
          # shared ConfigMap are ignored here.
          envFrom:
            - configMapRef:
                name: transaction-api-config
            - configMapRef:
                name: transaction-worker-config

          env:
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: transaction-api-secrets
                  key: app-db-password

            # Least privilege: tagg_app has DML on the module schemas and nothing else — it
            # can't alter tables, drop the audit triggers or read outside its grants
            # (k8s/postgres/init-roles.yaml). Only the db-migrate Job connects as tagg_migrator.
            - name: ConnectionStrings__transactiondb
              value: "Host=pgbouncer;Port=6432;Database=transactiondb;Username=tagg_app;Password=$(APP_DB_PASSWORD);Maximum Pool Size=20;No Reset On Close=true"

            - name: ConnectionStrings__redis
              valueFrom:
                configMapKeyRef:
                  name: transaction-api-config
                  key: REDIS_CONNECTION_STRING

            - name: ConnectionStrings__seq
              valueFrom:
                configMapKeyRef:
                  name: transaction-api-config
                  key: SEQ_URL

            # Kafka bootstrap servers (ConnectionStrings:kafka). The consumer only
            # starts when this is set.
            - name: ConnectionStrings__kafka
              valueFrom:
                configMapKeyRef:
                  name: transaction-worker-config
                  key: KAFKA_BOOTSTRAP_SERVERS

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

          # /liveness only checks the "self" tag — the process is up and responsive.
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          # The worker receives no traffic, so readiness never routes anything: it shows a
          # worker that cannot reach PostgreSQL as NotReady (instead of Running and blind),
          # and holds a rollout whose new pods could not do their job.
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18

      volumes:
        - name: tmp
          emptyDir: {}
