apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: transaction-worker
  namespace: transaction-aggregation
  labels:
    app.kubernetes.io/name: transaction-worker
    app.kubernetes.io/part-of: transaction-aggregation
spec:
  scaleTargetRef:
    name: transaction-worker
  minReplicaCount: 2
  maxReplicaCount: 6
  pollingInterval: 15
  cooldownPeriod: 300
  fallback:
    failureThreshold: 3
    replicas: 6
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 2
              periodSeconds: 60
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://prometheus.transaction-aggregation.svc.cluster.local:9090
        query: max(sum by (instance) (messaging_backlog_messages{job="transaction-worker",status="pending"}))
        threshold: "250"
        ignoreNullValues: "true"
