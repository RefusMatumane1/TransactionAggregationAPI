global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "docker-compose"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: transaction-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  # DNS discovery rather than a static target: with `--scale worker=N` the service name
  # resolves to every replica, and each one's counters must be scraped.
  - job_name: transaction-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8080
