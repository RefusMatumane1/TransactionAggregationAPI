global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "docker-compose"

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: transaction-api
    metrics_path: /metrics
    static_configs:
      # The API's private metrics port (Metrics__Port) — /metrics is not served on 8080.
      - targets: ["api:9464"]

  # DNS discovery rather than a static target: with `--scale worker=N` the service name
  # resolves to every replica, and each one's counters must be scraped.
  - job_name: transaction-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9464
